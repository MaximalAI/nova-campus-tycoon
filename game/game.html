<div id="nct" tabindex="0">
  <div id="viewport"></div>
  <div id="overlay-labels"></div>
  <div id="hud" class="hidden">
    <div id="hud-topleft">
      <div id="hud-stock" class="glass">
        <div class="hud-small">Stock <button id="stock-info" class="info-i" title="Show your whole stock">i</button></div>
        <div id="stock-list"></div>
      </div>
      <div id="hud-left" class="glass">
        <div class="hud-small">Reputation</div>
        <div id="rep-bar"><div id="rep-fill"></div></div>
        <div id="rep-value" class="hud-small"></div>
        <div id="rep-perks"></div>
        <button id="mono" title="Your way to the monopoly (click for details)">
          <span class="hud-small">Monopoly <b id="mono-value"></b></span>
          <span id="mono-bar"><span id="mono-fill"></span></span>
        </button>
      </div>
    </div>
    <div id="objective" class="glass"></div>
    <div id="hud-right" class="glass">
      <div class="clock-row">
        <div id="clock">05:00</div>
        <div id="day">Day 1</div>
      </div>
      <div class="speed-row">
        <button class="speed" data-speed="1">1x</button>
        <button class="speed" data-speed="2">2x</button>
        <button class="speed" data-speed="4">4x</button>
        <button class="speed" data-speed="8">8x</button>
        <button id="pause-btn" title="Pause (P)">❚❚</button>
      </div>
      <div class="money-row">
        <div id="money">€50.00</div>
        <button id="gain" title="Today's gain so far - click for statistics"><span id="gain-text">today €0.00</span><span class="info-i">i</span></button>
      </div>
      <div id="carry" class="hidden"></div>
      <button id="skip-btn" class="hidden" title="Jump to 08:00 and open the café">⏩ Start the day (08:00)</button>
    </div>
    <div id="shop-panel" class="glass hidden"></div>
    <div id="tray" class="glass hidden"></div>
    <div id="help" class="glass"><b>Click the game</b> for mouse look · <b>WASD</b> walk · <b>Shift</b> run · <b>E</b> use · <b>M</b> map · <b>Tab</b> list · <b>P</b> pause</div>
    <div id="crosshair" class="hidden"></div>
    <div id="minimap" class="glass" title="Click or press M to open the map"><canvas id="minimap-canvas" width="200" height="200"></canvas></div>
    <div id="bigmap" class="hidden">
      <div class="glass bigmap-box">
        <div class="bigmap-head"><b>🗺️ Campus map</b><span>Drag to look around, scroll to zoom. Click a place to go there.</span><button id="bigmap-close">✕</button></div>
        <div class="bigmap-wrap"><canvas id="bigmap-canvas" width="560" height="560"></canvas><div id="bigmap-spots"></div></div>
      </div>
    </div>
  </div>
  <div id="tab-panel" class="glass hidden"></div>
  <div id="toasts"></div>
  <div id="modal-layer" class="hidden"><div id="dialog"></div></div>
  <div id="fade"></div>
  <div id="loading">Building the campus ...</div>
</div>
