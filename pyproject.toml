[project]
name = "nova-campus-tycoon"
version = "0.1.0"
description = "Day-based café management game on a university campus (Streamlit, SQLite)."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.67.0",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
